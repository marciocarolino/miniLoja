spring.application.name=miniloja

# Default profile (mantém H2 como fallback local)
# Para usar Postgres/Redis via Docker: rode com -Dspring.profiles.active=dev
spring.datasource.url=jdbc:h2:file:./data/miniloja
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

info.app.name=MiniLoja
info.app.description=Sistema de controle de produtos, vendas e caixa
info.app.version=0.0.1-SNAPSHOT
