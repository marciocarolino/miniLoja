name: Build e Snyk

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-e-seguranca:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # -------------------------
      # BACK (Java / Maven)
      # -------------------------
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permissão ao Maven Wrapper (back)
        working-directory: back
        run: chmod +x mvnw

      - name: Compilar e executar testes (back)
        working-directory: back
        run: ./mvnw verify

      # -------------------------
      # FRONT (Angular / Node)
      # -------------------------
      - name: Configurar Node.js (front)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências (front)
        working-directory: front
        run: npm ci

      - name: Build do Angular (front)
        working-directory: front
        run: npm run build

      # -------------------------
      # SNYK
      # -------------------------
      - name: Instalar Snyk CLI
        run: npm install --global snyk

      - name: Verificar vulnerabilidades com Snyk (back - maven)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: back
        run: snyk test --file=pom.xml --package-manager=maven --severity-threshold=high

      - name: Verificar vulnerabilidades com Snyk (front - npm)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: front
        run: snyk test --severity-threshold=high
